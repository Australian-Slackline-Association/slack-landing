<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Slacklining Association - Finding Our Balance</title>
    <meta name="description"
        content="Australian Slacklining Association is currently undergoing maintenance. We will be back soon.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-mesh"></div>

    <main class="container">
        <div class="content-card fade-in-up">
            <div class="icon-wrapper">
                <!-- Simple SVG Icon representing balance/line -->
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
                </svg>
            </div>

            <h1>Australian Slacklining Association</h1>

            <p class="subtext">
                We're finding our balance. Our website is currently undergoing maintenance to bring you a better
                experience.
                We'll be back on the line soon.
            </p>

            <div class="image-gallery">
                <div class="img-wrapper">
                    <img src="img/A997484-R1-11-9A-1024x685.jpg" alt="Slacklining in nature" loading="lazy">
                </div>
                <div class="img-wrapper">
                    <img src="img/A997484-R1-24-26-1024x685.jpg" alt="Slacklining balance" loading="lazy">
                </div>
            </div>

            <div class="contact-divider"></div>

            <div class="contact-info">
                <p>For enquiries, please contact</p>
                <a href="mailto:info@slacklining.org.au" class="email-link">
                    info@slacklining.org.au
                    <svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>
            </div>
        </div>
    </main>
</body>

</html>
